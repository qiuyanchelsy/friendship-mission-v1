<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d50"><title>友情任務版本2｜窗邊的新朋友</title><meta name="description" content="六人選角、雙人確認、第一關完整對話與回憶頁。兩人共用 iPad，一起練習交朋友。"><link rel="stylesheet" href="novel.css"><link rel="stylesheet" href="v2.css?v=10"><script src="v2.js?v=10" defer></script><script src="routes.js?v=10" defer></script><script src="later.js?v=10" defer></script><script src="novel.js?v=10" defer></script></head><body>
<header class="topbar"><a class="brand" href="#" aria-label="回到六人選角"><span class="brand-mark">友</span><span>友情任務<small>窗邊的新朋友</small></span></a><div class="top-actions"><span class="edition">版本2 · 第一關</span><a class="version-link" href="../">版本1七關</a><button class="icon-button" id="settings" aria-label="開啟教師設定">設定</button></div></header>
<main id="app" tabindex="-1"></main>
<dialog id="settings-dialog"><form method="dialog"><div class="dialog-head"><h2>教師設定</h2><button class="icon-button" aria-label="關閉設定">關閉</button></div><label>討論時間<select id="discussion-setting"><option value="20">20 秒</option><option value="10">10 秒</option><option value="30">30 秒</option><option value="0">不計時</option></select></label><label class="check-label"><input type="checkbox" id="sound-setting"> 開啟輕柔音效</label><p>角色名稱代表遊戲化身，不用真名、不錄音。重新整理會清除本次選角與進度；回憶頁可存成圖片。</p><button class="primary">完成設定</button></form></dialog>
<dialog id="restart-dialog"><h2>回到選角？</h2><p>這一輪的對話與選擇會重新開始。若已完成，可先在回憶頁儲存圖片。</p><div class="button-row"><button class="secondary" id="cancel-restart">繼續遊玩</button><button class="primary" id="confirm-restart">回到選角</button></div></dialog>
